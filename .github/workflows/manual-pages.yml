name: shiire-kanri マニュアル GitHub Pages 配信

on:
  push:
    branches: [main]
    paths:
      - 'shiire-kanri/docs/manual/dist/**'
      - '.github/workflows/manual-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 公開するのは外注向けだけ。管理者向け（シート構造・GAS関数・API一覧）は載せない
      # PDF は 2026-08-27 に廃止済み。検索に出さないため noindex を差し込む
      - name: ルート index.html を生成
        run: |
          mkdir -p _site
          cp shiire-kanri/docs/manual/dist/外注向けマニュアル.html _site/
          sed -i 's#<head>#<head>\n<meta name="robots" content="noindex, nofollow">#' _site/外注向けマニュアル.html
          grep -q 'name="robots" content="noindex' _site/外注向けマニュアル.html
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="ja"><head><meta charset="utf-8">
          <meta name="robots" content="noindex, nofollow">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>shiire-kanri マニュアル</title>
          <style>
            body { font-family: -apple-system, "Hiragino Sans", sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #222; }
            h1 { color: #003d7a; }
            ul { list-style: none; padding: 0; }
            li { margin: 12px 0; padding: 16px; background: #f4f5f7; border-radius: 8px; }
            li a { color: #0066cc; text-decoration: none; font-weight: 600; font-size: 18px; }
            li small { display: block; color: #666; margin-top: 4px; }
          </style></head><body>
          <h1>📦 shiire-kanri マニュアル</h1>
          <ul>
            <li><a href="外注向けマニュアル.html">外注向けマニュアル</a><small>スマホ・PCで閲覧、画像タップで拡大／印刷はブラウザの印刷機能から</small></li>
          </ul>
          </body></html>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
