<html lang="ja">

<style>
  :root {
    --primary: #1565c0;
    --primary-dark: #0d47a1;
    --primary-light: #e3f2fd;
    --primary-soft: #e3f2fd;
    --accent: #ff6d00;
    --bg: #f4f6fa;
    --card: #ffffff;
    --surface: #ffffff;
    --text: #1a2330;
    --text-sub: #66707d;
    --text-mute: #6f7786; /* WCAG AA 対応: 旧 #9aa3b0 (2.77:1) → 4.6:1 */
    --border: #e3e7ee;
    --success: #2e7d32;
    --success-soft: #e8f5e9;
    --warning: #b95400; /* WCAG AA 対応: 旧 #ed6c02 (3.55:1) → 4.5:1 */
    --warning-soft: #fff4e5;
    --danger: #c62828;
    --danger-soft: #ffebee;
    --gray-soft: #eef0f4;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
    --focus-ring: 0 0 0 3px rgba(21,101,192,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { height: auto; overflow-y: auto; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
    /* iOSノッチ(safe-area-inset-top)を appbar・body 双方に加味することで、固定ヘッダの被りを全画面で解消 */
    padding-top: calc(102px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(76px + env(safe-area-inset-bottom)); min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  body.has-chips { padding-top: calc(146px + env(safe-area-inset-top, 0px)); }
  /* 詳細画面: 検索バーを隠して appbar が縮むので、コンテンツ上余白と sec-tabs sticky 位置を一致させる */
  body.view-detail { padding-top: calc(56px + env(safe-area-inset-top, 0px)); }
  body.view-detail .sec-tabs { top: calc(56px + env(safe-area-inset-top, 0px)); }
  /* topbar-search は display:flex が固定で当たるため hidden 属性だけでは消えない。明示的に上書き */
  body.view-detail .topbar-search { display: none !important; }
  /* グローバル focus-visible: WCAG 対応 */
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }
  .appbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    /* iOS ノッチ分の上余白を確保し、ステータスバー領域も同色で塗る */
    padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 10px;
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .appbar-row1 { display: flex; align-items: center; gap: 4px; min-height: 40px; }
  .appbar .icon-btn {
    width: 40px; height: 40px; background: rgba(255,255,255,.14); border: none; color: #fff;
    font-size: 20px; cursor: pointer; padding: 0; margin: 0 2px;
    display: flex; align-items: center; justify-content: center; border-radius: 10px;
    transition: background .15s;
  }
  .appbar .icon-btn:hover { background: rgba(255,255,255,.22); }
  .appbar .icon-btn:active { background: rgba(255,255,255,.28); }
  .appbar h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; padding-left: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-search {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.95); border-radius: 8px;
    padding: 6px 12px; min-height: 36px;
  }
  .topbar-search .search-ico {
    width: 16px; height: 16px; opacity: .55; flex-shrink: 0;
    color: var(--text-sub);
  }
  .topbar-search .search-ico svg {
    width: 100%; height: 100%; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .topbar-search input {
    flex: 1; border: none; outline: none; background: transparent;
    color: var(--text); font-size: 16px; padding: 4px 0; min-width: 0;
  }
  .topbar-search input::placeholder { color: var(--text-mute); }
  /* type="search" のブラウザ標準クリアボタン（Safari/Chrome）はカスタム .clear-btn と重複するため抑制 */
  .topbar-search input[type="search"] { -webkit-appearance: textfield; appearance: textfield; }
  .topbar-search input[type="search"]::-webkit-search-cancel-button,
  .topbar-search input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
  .topbar-search .clear-btn {
    background: transparent; border: none; color: var(--text-mute);
    font-size: 16px; line-height: 1; cursor: pointer; padding: 4px;
    display: none;
  }
  .topbar-search.has-value .clear-btn { display: inline-flex; align-items: center; }
  .drawer-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .drawer-mask.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 288px; max-width: 80vw; background: var(--surface);
    z-index: 201; transform: translateX(-100%); transition: transform 0.2s;
    box-shadow: 2px 0 12px rgba(0,0,0,0.18);
    display: flex; flex-direction: column;
  }
  .drawer.show { transform: translateX(0); }
  .drawer-header {
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff; padding: 22px 18px 18px;
  }
  .drawer-header .app-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; letter-spacing: .02em; }
  .drawer-header .user { font-size: 12px; opacity: 0.9; word-break: break-all; }
  .drawer-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .drawer-item {
    display: flex; align-items: center; padding: 12px 18px; cursor: pointer;
    color: var(--text); border-left: 4px solid transparent; font-size: 14px;
    min-height: 48px;
  }
  .drawer-item:hover { background: #f7f9fc; }
  .drawer-item:active { background: var(--primary-soft); }
  .drawer-item.active { background: var(--primary-soft); color: var(--primary-dark); border-left-color: var(--primary); font-weight: 600; }
  .drawer-item .ico { margin-right: 14px; font-size: 18px; width: 22px; height: 22px; text-align: center; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-sub); }
  .drawer-item.active .ico { color: var(--primary); }
  .drawer-item .ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .drawer-item .count {
    margin-left: auto; min-width: 26px; text-align: center;
    background: var(--gray-soft); color: var(--text-sub);
    padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .drawer-item.active .count { background: var(--primary); color: #fff; }
  .drawer-section-label {
    padding: 14px 18px 4px; font-size: 10px; color: var(--text-sub);
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .drawer-divider { border-top: 1px solid var(--border); margin: 6px 0; }
  /* searchbar は topbar-search に統合（後方互換のため空の擬似定義） */
  .searchbar { display: none; }
  .content { padding: 10px 12px; min-height: calc(100vh - 56px - 64px); }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--primary-soft); color: var(--primary-dark);
    padding: 6px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    margin: 4px 0 10px 0;
    border: 1px solid rgba(21,101,192,.18);
  }
  /* ===== chips フィルタストリップ（モックアップ） ===== */
  .chips-bar {
    position: fixed; top: calc(102px + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 90;
    background: var(--surface); border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 4px rgba(0,0,0,.04);
  }
  .chips-bar[hidden] { display: none !important; }
  .chips {
    display: flex; gap: 6px; padding: 8px 12px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 6px 12px; border-radius: 999px;
    background: var(--gray-soft); color: var(--text);
    font-size: 12px; font-weight: 500;
    border: 1px solid transparent;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer; user-select: none;
  }
  .chip:hover { background: #e6e9ef; }
  .chip.active {
    background: var(--primary); color: #fff; border-color: var(--primary);
  }
  .chip-count {
    background: rgba(255,255,255,.3); color: inherit;
    padding: 1px 6px; border-radius: 8px; font-size: 11px; font-weight: 600;
    min-width: 18px; text-align: center;
  }
  .chip:not(.active) .chip-count {
    background: var(--surface); color: var(--text-sub);
  }
  /* 出品作業中タブの「使用アカウント」サブチップ行（コンテンツ内インライン） */
  .chips-account {
    margin: 4px 0 8px 0; padding: 4px 0;
  }
  /* ===== カード（モックアップ pcard ベース） ===== */
  .card {
    background: var(--surface); border-radius: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 8px; padding: 12px 14px; cursor: pointer;
    border-left: 4px solid transparent;
    transition: background .12s, box-shadow .12s;
    content-visibility: auto;
    contain-intrinsic-size: 0 96px;
  }
  /* 仮想スクロール用スペーサ（表示範囲外のカード分の高さを予約） */
  .vlist-top-spacer, .vlist-bottom-spacer { display: block; }
  .vlist-window { display: contents; }
  /* 仮想スクロール内では content-visibility による「追いかけ表示」を無効化
     （vlist が表示範囲だけマウントするので二重スキップは不要） */
  .vlist-window > .card { content-visibility: visible; contain-intrinsic-size: auto; }
  .card.has-thumb { display: flex; gap: 12px; align-items: flex-start; }
  .card-thumb {
    width: 56px; height: 56px; border-radius: 8px;
    background: var(--gray-soft); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-mute); font-size: 28px;
    /* 📷 絵文字を確実に描画するため絵文字フォントを明示
       （Win Chrome 等で system-ui にフォールバックすると豆腐化することがある） */
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji",
                 "Segoe UI Symbol", "Twemoji Mozilla", sans-serif;
    overflow: hidden;
  }
  .card-thumb img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  /* 画像未登録（/api/products/has-images に含まれない確定状態） — 読込中と区別する */
  .card-thumb-empty {
    background: #eef0f2;
    color: #888;
    border: 1px dashed #c0c4c8;
  }
  .card-body { flex: 1; min-width: 0; }
  .card:hover { box-shadow: var(--shadow-lg); }
  .card:active { background: #f7f9fc; }
  /* ステータスでの左ボーダー色分け（モックアップ s-* 互換） */
  .card.s-overdue { border-left-color: var(--danger); background: #fff8f8; }
  .card.s-shukka  { border-left-color: var(--primary); }
  .card.s-sokutei { border-left-color: var(--warning); }
  .card.s-sold    { border-left-color: var(--success); }
  .card-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .card-kanri { font-weight: 700; font-size: 15px; color: var(--primary); letter-spacing: .02em; }
  .card-status {
    margin-left: auto;
    font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 6px;
    background: var(--gray-soft); color: var(--text-sub);
  }
  .card-status.sold { background: var(--danger-soft); color: var(--danger); }
  .card-status.measured { background: var(--success-soft); color: var(--success); }
  .card-status.shipping-pending { background: var(--warning-soft); color: var(--warning); }
  .card-status.shipped { background: var(--primary-soft); color: var(--primary); }
  .card-deadline {
    font-size: 11px; color: var(--text-sub); margin-top: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .card-place {
    font-size: 11px; color: var(--text-sub); margin-top: 4px;
    display: flex; align-items: center; gap: 4px;
  }
  .card-deadline.overdue { color: var(--danger); font-weight: 700; }
  .card-deadline.today {
    color: var(--danger); font-weight: 700;
    background: var(--danger-soft); padding: 3px 8px; border-radius: 6px;
    border-left: 3px solid var(--danger); display: inline-flex;
    margin-top: 6px;
  }
  .img-field { display: flex; gap: 12px; align-items: flex-start; }
  .img-preview-wrap { position: relative; flex-shrink: 0; }
  .img-delete-btn {
    position: absolute; top: -8px; right: -8px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--danger, #e53935); color: white;
    border: 2px solid white;
    font-size: 14px; line-height: 1; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.25);
    padding: 0; z-index: 2;
  }
  .img-delete-btn:hover { background: #c62828; }
  .img-delete-btn:active { transform: scale(0.92); }
  .img-delete-btn.armed {
    background: #c62828; transform: scale(1.25);
    box-shadow: 0 0 0 4px rgba(229,57,53,.25), 0 1px 3px rgba(0,0,0,.3);
    animation: img-delete-pulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes img-delete-pulse {
    from { box-shadow: 0 0 0 4px rgba(229,57,53,.25), 0 1px 3px rgba(0,0,0,.3); }
    to   { box-shadow: 0 0 0 7px rgba(229,57,53,.10), 0 1px 3px rgba(0,0,0,.3); }
  }
  /* 任意フィールドの ✕ クリアボタン（画像と同じ 2 段タップ・3 秒ルール） */
  .field-input-wrap {
    display: flex; align-items: flex-start; gap: 6px;
    width: 100%; min-width: 0;
  }
  .field-input-wrap > input,
  .field-input-wrap > select,
  .field-input-wrap > textarea {
    flex: 1 1 auto; min-width: 0; width: auto;
  }
  .field-input-wrap > .field-with-icon,
  .field-input-wrap > .yesno-toggle {
    flex: 1 1 auto; min-width: 0;
  }
  .field-input-wrap > a { flex: 0 0 auto; align-self: center; }
  .field-clear-btn {
    flex: 0 0 auto;
    width: 32px; height: 38px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: #f4f6fa; color: #8a93a3;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; line-height: 1; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s, transform .08s;
  }
  .field-clear-btn:hover { background: #fde2e2; color: var(--danger, #e53935); border-color: #f5c2c2; }
  .field-clear-btn:active { transform: scale(0.94); }
  .field-clear-btn.armed {
    background: var(--danger, #e53935); color: #fff; border-color: var(--danger, #e53935);
    font-weight: 700;
    animation: field-clear-pulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes field-clear-pulse {
    from { box-shadow: 0 0 0 0 rgba(229,57,53,.45); }
    to   { box-shadow: 0 0 0 5px rgba(229,57,53,.05); }
  }
  /* 狭いグリッド列内ではクリアボタンも一回り小さく */
  .field-grid-2 .field-clear-btn,
  .field-grid-3 .field-clear-btn,
  .meas-grid .field-clear-btn { width: 28px; height: 36px; }
  .img-preview {
    display: flex; align-items: center; justify-content: center;
    width: 96px; height: 96px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 8px;
    background: #f7f9fc; overflow: hidden;
    font-size: 11px; color: var(--text-mute); text-align: center; padding: 4px;
    text-decoration: none; cursor: pointer;
  }
  .img-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-preview.img-loading { color: var(--primary); }
  .img-preview.img-error { color: var(--danger); background: var(--danger-soft); }
  /* アップロード進行中のオーバーレイ：再描画が起きてもローカルプレビューを保持しつつスピナーを重畳 */
  .img-preview.img-uploading { position: relative; }
  .img-preview.img-uploading::before {
    content: ''; position: absolute; inset: 0;
    background: rgba(0,0,0,0.32); border-radius: inherit; pointer-events: none;
  }
  .img-uploading-spinner {
    position: absolute; top: 50%; left: 50%;
    width: 32px; height: 32px; margin: -16px 0 0 -16px;
    border: 3px solid rgba(255,255,255,0.5);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    pointer-events: none;
  }
  .img-actions { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .img-upload-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; min-height: 38px;
    background: var(--primary); color: white;
    border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; align-self: flex-start; user-select: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .img-upload-btn.ghost {
    background: var(--surface); color: var(--primary);
    border: 1px solid var(--primary); box-shadow: none;
  }
  .img-upload-btn:hover { background: var(--primary-dark); }
  .img-upload-btn.ghost:hover { background: var(--primary-soft); }
  .img-upload-btn:active { background: var(--primary-dark); }
  .img-hint { font-size: 11px; color: var(--text-sub); }
  .img-status { font-size: 12px; color: var(--text-sub); min-height: 16px; }
  .img-status.success { color: var(--success); }
  .img-status.error { color: var(--danger); }
  /* 画像拡大モーダル（タップで閉じる） */
  .img-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.92);
    z-index: 9000; display: none;
    align-items: center; justify-content: center;
    padding: 16px;
  }
  .img-modal.show { display: flex; }
  .img-modal img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
  }
  .img-modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 44px; height: 44px;
    background: rgba(255,255,255,.18); color: #fff;
    border: none; border-radius: 50%;
    font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  /* モーダル内の前後ナビ（複数画像があるときだけ表示） */
  .img-modal-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 48px; height: 72px;
    background: rgba(255,255,255,.18); color: #fff;
    border: none; border-radius: 8px;
    font-size: 32px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  .img-modal-prev { left: 12px; }
  .img-modal-next { right: 12px; }
  .img-modal-counter {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.55); color: #fff;
    padding: 4px 14px; border-radius: 999px;
    font-size: 13px; pointer-events: none;
  }
  /* 基本タブの画像プレビュー（hero 直下） */
  .basic-imgs {
    display: flex; gap: 10px; padding: 12px 12px 10px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    background: var(--surface); border-bottom: 1px solid var(--border);
    margin: 0 -12px;
  }
  .basic-imgs::-webkit-scrollbar { display: none; }
  .basic-img {
    width: 80px; height: 80px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; cursor: pointer;
    background: #f7f9fc;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--text-mute); text-align: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.06);
    transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .basic-img:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(21,101,192,.18);
    border-color: var(--primary);
  }

    padding: 9px 30px 9px 11px; min-height: 38px;
    background: #fff url("data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 14 14%27><path d=%27M3 5l4 4 4-4%27 fill=%27none%27 stroke=%27%236b7588%27 stroke-width=%272%27/></svg>") no-repeat right 10px center;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 16px; color: var(--text); cursor: pointer; line-height: 1.4;
    display: flex; align-items: center; gap: 6px;
    transition: border-color .12s, background-color .12s, box-shadow .12s;
  }
  /* 狭いグリッド（field-grid-2/3）では native select と同じく詰める */
  .field-grid-2 > .field-row .cs-trigger,
  .field-grid-3 > .field-row .cs-trigger {
    padding: 8px 28px 8px 10px; min-height: 36px;
  }
  .cs-trigger:hover { border-color: #c9d1dd; }
  .cs-wrap.open > .cs-trigger { border-color: var(--primary); box-shadow: var(--focus-ring); }
  /* カスタムセレクト（販売場所・採寸者など）は native <select> が不可視なので、
     .invalid-field の赤枠がそのままでは見えない。隣接する可視トリガーへ赤枠を伝播させる。
     background ではなく background-color のみ上書きしてドロップダウン矢印は残す。 */
  .cs-wrap > select.cs-native.invalid-field ~ .cs-trigger {
    border-color: var(--danger) !important;
    background-color: var(--danger-soft) !important;
    box-shadow: 0 0 0 3px rgba(198,40,40,.12) !important;
    animation: invalid-shake .25s ease-in-out;
  }
  .cs-trigger.is-empty .cs-display { color: #9aa3b2; }
  .cs-trigger:disabled, .cs-trigger[aria-disabled="true"] { background-color: #f3f5f9; color: #9aa3b2; cursor: not-allowed; }
  .cs-display { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cs-popover {
    /* z-index は bottomnav(100)・sticky アクションバー(90〜110) より高くして、
       わずかに重なっても popover が裏に隠れないようにする（高さ制限は JS 側で実施） */
    position: absolute; top: calc(100% + 4px); left: 0; right: auto; z-index: 130;
    /* トリガーが狭い列（カテゴリ2/3 等）に置かれていても popover は広げる。
       min-width=100% で「最低でもトリガー幅」、width:max-content で項目テキストに合わせて拡張、
       max-width: 90vw で画面外にはみ出さない。 */
    min-width: 100%; width: max-content; max-width: 90vw;
    border: 1px solid var(--border); border-radius: 10px; background: #fff;
    box-shadow: 0 8px 24px rgba(20,30,60,.14); overflow: hidden; display: none;
  }
  /* popover が画面右端を超えるときは右寄せ（cs-wrap.flip-right に JS でクラス付与） */
  .cs-wrap.flip-right > .cs-popover { left: auto; right: 0; }
  /* popover が画面下端を超えるときはトリガーの上に表示（cs-wrap.flip-up） */
  .cs-wrap.flip-up > .cs-popover { top: auto; bottom: calc(100% + 4px); }
  .cs-wrap.open > .cs-popover { display: block; }
  .cs-search {
    width: 100%; box-sizing: border-box; padding: 10px 12px;
    border: none; border-bottom: 1px solid #eef1f5;
    font-size: 16px; background: #f8fafc; outline: none; -webkit-appearance: none;
  }
  .cs-list { max-height: 50vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .cs-item {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid #f1f3f7;
    cursor: pointer; font-size: 15px; color: var(--text);
  }
  .cs-item:last-child { border-bottom: none; }
  .cs-item:active, .cs-item.active { background: #eff5ff; }
  .cs-item.selected { background: #f4f8ff; font-weight: 600; }
  .cs-check { width: 14px; flex: 0 0 14px; color: #2563eb; font-weight: 700; visibility: hidden; }
  .cs-item.selected .cs-check { visibility: visible; }
  .cs-label { flex: 1; min-width: 0; word-break: break-word; }
  .cs-empty { padding: 14px 12px; text-align: center; color: var(--text-sub); font-size: 13px; }
  /* 採寸行は横並び（80px 1fr 24px）を維持 */
  .field-row.measure-row {
    display: grid; grid-template-columns: 80px 1fr 24px;
    align-items: center; gap: 12px;
    padding: 10px 4px;
  }
  .field-row.measure-row label { margin-bottom: 0; }
  .field-row .unit { color: var(--text-sub); font-size: 12px; text-align: left; }
  .field-readonly {
    padding: 4px 0; color: var(--text); font-size: 15px;
    min-height: 28px; word-break: break-all;
    font-weight: 500;
  }
  /* ステータスは派生値で編集不可。「自動算出」と分かるよう淡色バッジ風表示にする。 */
  .field-readonly.status-readonly {
    display: inline-block; padding: 6px 12px;
    background: #f3f5f9; color: #334; border: 1px solid #e3e8f0;
    border-radius: 999px; font-size: 14px; font-weight: 600;
    min-height: 0;
  }
  /* select + アイコン横並び（発送方法・性別） */
  .field-with-icon { display: flex; align-items: center; gap: 8px; }
  .field-with-icon select { flex: 1 1 auto; min-width: 0; }
  .field-with-icon > .cs-wrap { flex: 1 1 auto; min-width: 0; }
  .field-icon-slot { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; }
  .field-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--gray-soft);
    border: 1px solid var(--border);
    transition: background .15s, border-color .15s, transform .15s;
  }
  .field-icon svg { display: block; width: 20px; height: 20px; }
  .field-icon.is-post { background: #fff5f5; border-color: #ffd7d7; }
  .field-icon.is-yamato { background: #fffbe6; border-color: #ffe79e; }
  .field-icon.is-male { background: #eaf3ff; border-color: #c8defc; }
  .field-icon.is-female { background: #ffeaf3; border-color: #f9c4de; }
  .field-icon.is-kid { background: #f1ffe9; border-color: #c8eab2; }
  .field-icon.is-uni { background: #f3eeff; border-color: #d8caf6; }
  .field-icon.is-empty { opacity: .35; }

  /* 詳細画面 前後ナビ（控えめ — 画面の視認性を妨げない） */
  .detail-nav { display: contents; } /* レイアウトに影響しない（中の要素は fixed） */
  .nav-btn {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    appearance: none; -webkit-appearance: none;
    background: rgba(255, 255, 255, 0.55); color: #1a2330;
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 999px;
    cursor: pointer; z-index: 90;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    opacity: .55;
    transition: background .15s, opacity .15s, transform .08s;
  }
  .nav-btn.nav-prev { left: 4px; }
  .nav-btn.nav-next { right: 4px; }
  .nav-btn svg { width: 18px; height: 18px; display: block; }
  .nav-btn:hover:not(:disabled),
  .nav-btn:focus-visible:not(:disabled) {
    background: rgba(255, 255, 255, 0.92);
    opacity: 1;
  }
  .nav-btn:active:not(:disabled) { transform: translateY(-50%) scale(.92); }
  .nav-btn:disabled { opacity: .15; cursor: not-allowed; }
  .nav-pos {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--text-sub);
    background: rgba(255, 255, 255, 0.7);
    padding: 2px 8px; border-radius: 999px; z-index: 90;
    font-variant-numeric: tabular-nums; pointer-events: none;
    border: 1px solid rgba(0, 0, 0, 0.05);
    opacity: .7;
  }
  .nav-pos .nav-pos-cur { font-weight: 700; color: var(--text); }
  /* タップ時のみフルに表示する端末（hover 不可）でも視認できるように */
  @media (hover: none) {
    .nav-btn { opacity: .65; }
  }
  /* PC 幅では本文（max-width:1100px）の外側ガター内に配置してフォームと重ねない。
     content 端 = 50vw ± 550px、ボタン幅 36px、4px のすき間 → 50vw - 590px */
  @media (min-width: 720px) {
    .nav-btn.nav-prev { left: max(4px, calc(50vw - 590px)); }
    .nav-btn.nav-next { right: max(4px, calc(50vw - 590px)); }
  }

  /* ===== 詳細表示（モックアップ準拠） ===== */

  /* 収支サマリ（販売タブ末尾） */

  /* 商品削除ゾーン（最下部・独立配置） */

  /* 保存バー（差分があるとき下部に固定） */

  .btn-save {
    padding: 10px 20px; background: linear-gradient(180deg, #43a047 0%, var(--success) 100%);

  .fab-stack {

  .toast {

  .loading { text-align: center; padding: 40px; color: var(--text-sub); }

    content: '';

    width: 14px;
    height: 14px;
    margin-right: 8px;

  /* 初期 Skeleton: スクリプト読込中も即座に視覚を確保し FCP/LCP を稼ぐ */

  @keyframes skShimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  /* Pull-to-refresh インジケータ（appbar 直下にピル表示） */
  .ptr-indicator {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 6px);
    transform: translate(-50%, -60px); opacity: 0;
    z-index: 95; pointer-events: none;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border);
    box-shadow: 0 6px 16px rgba(0,0,0,.18);
    border-radius: 999px;
    padding: 8px 14px; min-height: 36px;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; white-space: nowrap;
    transition: opacity .18s ease, transform .25s cubic-bezier(.2,.8,.2,1);
    will-change: transform, opacity;
  }
  .ptr-indicator.ptr-hide { transition: opacity .18s ease, transform .22s ease; transform: translate(-50%, -60px) !important; opacity: 0 !important; }
  .ptr-indicator .ptr-icon { display: none; width: 16px; height: 16px; align-items: center; justify-content: center; font-size: 14px; line-height: 1; color: var(--primary); }
  .ptr-indicator .ptr-arrow { display: inline-flex; transition: transform .15s ease; }
  .ptr-indicator.ptr-ready .ptr-arrow { transform: rotate(180deg); }
  .ptr-indicator.ptr-loading .ptr-arrow { display: none; }
  .ptr-indicator.ptr-loading .ptr-spin {
    display: inline-flex; width: 16px; height: 16px;
    border: 2px solid rgba(21,101,192,.22); border-top-color: var(--primary);
    border-radius: 50%; animation: ptr-spin 0.7s linear infinite;
  }
  .ptr-indicator.ptr-done .ptr-arrow,
  .ptr-indicator.ptr-done .ptr-spin { display: none; }
  .ptr-indicator.ptr-done .ptr-check { display: inline-flex; color: #2e7d32; }
  .ptr-indicator.ptr-error .ptr-arrow,
  .ptr-indicator.ptr-error .ptr-spin { display: none; }
  .ptr-indicator.ptr-error .ptr-check { display: inline-flex; color: #c62828; }
  @keyframes ptr-spin { to { transform: rotate(360deg); } }

  /* AppSheet 互換タブ用（場所/返送/AI/作業者/業務） */

  /* 登録/キャンセル等をボトム固定（場所移動・返送の新規作成フォーム用）。
     bottomnav (64px + safe-area) の上に乗せる。中身は .form-card.with-sticky-actions の padding-bottom で被らないようにする。 */
  .form-actions.sticky {
    position: fixed; left: 0; right: 0;
    bottom: calc(64px + env(safe-area-inset-bottom));
    margin: 0; padding: 10px 12px;
    background: var(--surface); border-top: 1px solid var(--border);
    box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
    z-index: 90;
  }
  .form-card.with-sticky-actions { padding-bottom: 16px; margin-bottom: calc(80px + env(safe-area-inset-bottom)); }
  /* 商品新規作成フォーム（複数の form-card + section が並ぶレイアウト）の sticky アクション余白 */
  .create-product-form.with-sticky-actions { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--gray-soft); color: var(--text); }
  .btn-secondary:hover { background: #e3e7ee; }
  /* 任意ボタンに付ける処理中スピナー。テキスト前にくるくる回るリング */
  .btn-loading { cursor: wait !important; opacity: .92; }
  .btn-loading::before {
    content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 8px;
    border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%;
    vertical-align: -2px; animation: btn-loading-spin .7s linear infinite;
  }
  /* 白文字でないボタン（btn-secondary等）用にダーク版 */
  .btn-secondary.btn-loading::before {
    border-color: rgba(0,0,0,.18); border-top-color: rgba(0,0,0,.7);
  }
  @keyframes btn-loading-spin { to { transform: rotate(360deg); } }
  /* 画面トップに走るプログレスバー（API 呼び出し中表示） */
  #global-progress {
    position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 9999;
    background: transparent; pointer-events: none; overflow: hidden;
    opacity: 0; transition: opacity .15s;
  }
  #global-progress.on { opacity: 1; }
  #global-progress::before {
    content: ''; display: block; width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    animation: global-progress-slide 1.1s linear infinite;
  }
  @keyframes global-progress-slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  /* 注意書きバナー */
  .notice { background: #fff7e6; color: #8a5a00; border: 1px solid #ffd591; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
  .notice strong { color: #b07000; }
  /* タップ可能なカード */
  .card.clickable { cursor: pointer; transition: background-color .12s; }
  .card.clickable:hover { background: #f7f9fc; }
  .card.clickable:active { background: #eef2f8; }
  /* スワイプ操作（Spark Mail 風）—— カードと一体化、左/右スワイプで異なるアクション + 2段階確認 */
  /* PC は行ホバーで両端のアクションアイコンを表示。どちらも armed 状態 (3秒) で再タップ確定。 */
  /* swipe-wrap 自体に border-radius + overflow:hidden で内側カードと一体化（はみ出し防止） */
  .swipe-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    margin-bottom: 10px;
    isolation: isolate; /* z-index コンテキストを wrap に閉じる */
  }
  /* 内側カードが独自の margin/border-radius を持つと隙間や角ズレが出るので無効化 */
  .swipe-wrap > .swipe-target > .card,
  .swipe-wrap > .swipe-target > .shiire-card,
  .swipe-wrap > .swipe-target > .move-card,
  .swipe-wrap > .swipe-target > .hensou-card {
    margin: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }
  /* swipe-actions は左右どちらにも置けるよう left/right 個別 */
  .swipe-wrap .swipe-actions {
    position: absolute; top: 0; bottom: 0;
    display: flex; align-items: stretch;
    pointer-events: none;
    z-index: 0; /* 常に swipe-target の下に置く（target スライドで露出） */
  }
  .swipe-wrap .swipe-actions.actions-right { right: 0; }
  .swipe-wrap .swipe-actions.actions-left { left: 0; }
  .swipe-wrap .swipe-actions .act {
    pointer-events: auto;
    border: none; outline: none; cursor: pointer;
    font-size: 20px; line-height: 1; padding: 0 18px;
    color: #fff; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    min-width: 72px;
    transition: background-color .15s;
  }
  .swipe-wrap .swipe-actions .act.del { background: #d93025; }
  .swipe-wrap .swipe-actions .act.del.armed { background: #a71d10; }
  .swipe-wrap .swipe-actions .act.del.armed::after {
    content: '本当に削除？'; font-size: 11px; font-weight: 700; margin-left: 6px; white-space: nowrap;
  }
  .swipe-wrap .swipe-actions .act.edit { background: #1a73e8; }
  .swipe-wrap .swipe-actions .act.edit.armed { background: #0d47a1; }
  .swipe-wrap .swipe-actions .act.edit.armed::after {
    content: '編集する？'; font-size: 11px; font-weight: 700; margin-left: 6px; white-space: nowrap;
  }
  .swipe-wrap .swipe-actions .act.edit::before { content: '✏'; font-size: 18px; }
  .swipe-wrap .swipe-actions .act.del::before { content: '🗑'; }
  .swipe-wrap .swipe-actions .act > .act-label { font-size: 11px; margin-left: 4px; }
  /* スピナー（削除/更新中） */
  .swipe-wrap .swipe-actions .act.loading::before { content: ''; }
  .swipe-wrap .swipe-actions .act.loading::after {
    content: ''; display: inline-block; width: 18px; height: 18px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff;
    animation: spin .7s linear infinite; margin: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .swipe-wrap > .swipe-target {
    position: relative; z-index: 1; background: var(--surface);
    transition: transform .18s ease-out, opacity .25s, max-height .25s;
    will-change: transform;
    touch-action: pan-y;
  }
  /* 左スワイプで右側アクション露出（削除） */
  .swipe-wrap.is-open-right > .swipe-target { transform: translateX(-80px); }
  .swipe-wrap.is-open-right.armed > .swipe-target { transform: translateX(-160px); }
  /* 右スワイプで左側アクション露出（編集） */
  .swipe-wrap.is-open-left > .swipe-target { transform: translateX(80px); }
  .swipe-wrap.is-open-left.armed > .swipe-target { transform: translateX(160px); }
  /* 削除実行中: target を半透明＋pointer無効化 */
  .swipe-wrap.is-deleting > .swipe-target { opacity: .4; pointer-events: none; }
  /* デフォルトでは PC 専用要素を非表示（モバイルでは縦長フローティングを出さない） */
  .swipe-wrap .pc-actions { display: none; }
  /* PC: スワイプではなく、カード右上に編集/削除アイコンを縦に並べる方式（ホバーでフェードイン） */
  /* min-width で確実にモバイル幅では分岐させない（pointer/hover だけだと iPad+キーボードや外部マウスで誤判定するため） */
  @media (min-width: 769px) and (hover: hover) and (pointer: fine) {
    /* モバイル用の左右フル高ボタンは非表示にする */
    .swipe-wrap .swipe-actions { display: none !important; }
    /* PC でカードはスライドさせない */
    .swipe-wrap.is-open-right > .swipe-target,
    .swipe-wrap.is-open-left > .swipe-target,
    .swipe-wrap.is-open-right.armed > .swipe-target,
    .swipe-wrap.is-open-left.armed > .swipe-target { transform: none !important; }
    /* PC 用の小型フローティングアイコン群（縦並び: 編集が上、削除が下） */
    .swipe-wrap { position: relative; }
    .swipe-wrap .pc-actions {
      position: absolute; top: 8px; right: 8px; z-index: 3;
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
      opacity: 0; transition: opacity .12s ease-out;
      pointer-events: none;
    }
    .swipe-wrap:hover .pc-actions,
    .swipe-wrap .pc-actions:focus-within { opacity: 1; pointer-events: auto; }
    .swipe-wrap .pc-actions .pc-act {
      width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 15px; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18);
      transition: transform .08s, background-color .15s, box-shadow .15s, width .12s ease-out;
      padding: 0; overflow: hidden; white-space: nowrap;
    }
    .swipe-wrap .pc-actions .pc-act.edit { background: #1a73e8; }
    .swipe-wrap .pc-actions .pc-act.edit:hover { background: #1762c5; }
    .swipe-wrap .pc-actions .pc-act.del { background: #d93025; }
    .swipe-wrap .pc-actions .pc-act.del:hover { background: #b1271b; }
    .swipe-wrap .pc-actions .pc-act.armed { width: auto; padding: 0 10px; gap: 4px; font-size: 12px; font-weight: 700; }
    .swipe-wrap .pc-actions .pc-act.edit.armed { background: #0d47a1; }
    .swipe-wrap .pc-actions .pc-act.del.armed { background: #a71d10; }
    .swipe-wrap .pc-actions .pc-act .pc-label { display: none; }
    .swipe-wrap .pc-actions .pc-act.armed .pc-label { display: inline; }
    .swipe-wrap .pc-actions .pc-act .pc-icon { display: inline; }
    .swipe-wrap .pc-actions .pc-act.armed .pc-icon { display: none; }
    /* スピナー */
    .swipe-wrap .pc-actions .pc-act.loading { width: 32px; padding: 0; }
    .swipe-wrap .pc-actions .pc-act.loading .pc-icon,
    .swipe-wrap .pc-actions .pc-act.loading .pc-label { display: none; }
    .swipe-wrap .pc-actions .pc-act.loading::after {
      content: ''; display: inline-block; width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
      animation: spin .7s linear infinite;
    }
    /* カード本体に右側余白を確保（縦並びアイコンとの衝突回避、横幅は1個分の48pxで十分） */
    .swipe-wrap > .swipe-target > .card,
    .swipe-wrap > .swipe-target > .shiire-card,
    .swipe-wrap > .swipe-target > .move-card,
    .swipe-wrap > .swipe-target > .hensou-card { padding-right: 48px !important; }
  }
  /* ID 多重選択ピッカー（移動報告） */

  .muted { color: var(--text-sub); font-size: 13px; padding: 6px 0; }

  .ids-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #f3f5f9; font-size: 14px; cursor: pointer; }

  .modal-mask {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 200;
    align-items: flex-end; justify-content: center;
    /* マスク自体のホイール/タッチを止め、裏の一覧へのスクロール突き抜け（chain）を防ぐ */
    overscroll-behavior: contain;
    touch-action: none;
  }
  .modal-mask.show { display: flex; }
  .modal {
    width: 100%; max-width: 480px; background: var(--surface);
    border-radius: 14px 14px 0 0; padding: 18px;
    max-height: 85vh; overflow-y: auto;
    /* iOS 慣性スクロール時、モーダル末端で背後の一覧にスクロールが伝播するバグ対策 */
    overscroll-behavior: contain;

  /* モーダル表示中は背後の body スクロールを停止（保険として外側からも止める） */

  /* 詳細離脱時の案内シート（保存/破棄/キャンセル） */

  /* 入力セット必須バリデーションの中央エラーカード */
  .errcard-mask {
    display: none; position: fixed; inset: 0;

  .errcard h3 { margin: 0 0 8px; font-size: 16px; font-weight: 700; color: var(--danger); }
  .errcard p { margin: 0 0 18px; font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-line; }
  .errcard-btn {

  .size-help-btn {
    display: inline-flex; align-items: center; justify-content: center;

  }

  .modal-overlay {

    padding: 16px;

  .modal-overlay .modal-content {

  .yesno-toggle { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .yesno-btn {
    padding: 8px 14px; min-width: 56px; min-height: 40px;

  .field-grid-2 > .field-row .yesno-btn {
    padding: 6px 10px; min-width: 44px; min-height: 36px; font-size: 13px;
  }
  .yesno-btn.yesno-yes.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .yesno-btn.yesno-no.active  { background: var(--danger); color: #fff; border-color: var(--danger); }
  .yesno-btn.yesno-clear { padding: 8px 10px; min-width: 36px; color: var(--text-sub); }
  .yesno-btn.yesno-clear.active { background: var(--gray-soft); color: var(--text); border-color: #aaa; }

  /* textarea 自動拡張 */
  textarea.auto-grow {
    min-height: 40px; max-height: 480px;
    overflow-y: auto; resize: vertical;

  .list-meta {

    padding: 4px 4px 8px; font-size: 12px; color: var(--text-sub);

  /* ===== PC レイアウト調整（768px 以上） ===== */
  @media (min-width: 768px) {
    body { padding-left: 16px; padding-right: 16px; }
    .content { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .field-row { display: grid; grid-template-columns: 140px 1fr; align-items: start; gap: 14px; padding: 12px 0; }
    .field-row label { margin-bottom: 0; padding-top: 8px; }
    /* グリッド内の field-row は PC でもブロック表示（label + input 縦並び） */
    .field-grid-2 > .field-row, .field-grid-3 > .field-row, .meas-grid > .field-row {
      display: block; padding: 0; margin: 0; background: transparent;
    }
    .meas-grid > .field-row { padding: 4px 0; }
    .field-grid-2 > .field-row label, .field-grid-3 > .field-row label, .meas-grid > .field-row label {
      padding-top: 0;
    }
    .form-section { padding: 0 18px; }
    .product-info { padding: 18px 20px; }
    .product-info h2 { font-size: 24px; }
    /* sec-tabs を viewport 幅に full-bleed して appbar と揃え、
       タブを均等分散（各タブ flex: 1）して右端まで広げる。
       overflow-x: auto は PC では不要（横スクロール不要・常に全タブ可視）。*/
    .sec-tabs {
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
      padding-left: max(16px, calc(50vw - 550px));
      padding-right: max(16px, calc(50vw - 550px));
      overflow-x: visible;
      box-sizing: border-box;
    }
    .sec-tab { flex: 1 1 0; text-align: center; padding: 14px 8px; font-size: 14px; }
    /* chips-bar は固定。内側 .chips は content と揃える（PC で帯が左寄せにならないよう全幅化） */
    .chips {
      padding-left: max(12px, calc(50vw - 534px));
      padding-right: max(12px, calc(50vw - 534px));
    }
    /* bottomnav も PC では均等分散（mobile の inline-flex+min-width だと左に固まる） */
    .bottomnav { overflow-x: visible; }
    .bottomnav-inner {
      display: flex;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      box-sizing: border-box;
    }
    .bottomnav button { flex: 1 1 0; min-width: 0; }
  }
  /* ===== 売上ダッシュボード ===== */
  .dash-wrap { display: flex; flex-direction: column; gap: 14px; padding: 4px 0 24px; }
  .dash-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .dash-card.primary {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff; border: none;
  }
  .dash-card.primary .dash-label,
  .dash-card.primary .dash-sub { color: rgba(255,255,255,.85); }
  .dash-card.primary .dash-num { color: #fff; }
  .dash-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    margin-bottom: 8px;
  }
  .dash-title { font-size: 13px; font-weight: 600; opacity: .9; letter-spacing: .02em; }
  .dash-period { font-size: 12px; opacity: .7; }
  .dash-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 16px;
  }
  .dash-grid.three { grid-template-columns: repeat(3, 1fr); }
  .dash-cell { min-width: 0; }
  .dash-label { font-size: 11px; color: var(--text-mute); margin-bottom: 2px; letter-spacing: .04em; }
  .dash-num {
    font-size: 22px; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums; letter-spacing: -.01em;
    word-break: keep-all; white-space: nowrap;
  }
  .dash-num.small { font-size: 16px; font-weight: 600; }
  .dash-sub { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
  .dash-delta { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display: inline-block; }
  .dash-delta.up { background: var(--success-soft); color: var(--success); }
  .dash-delta.down { background: var(--danger-soft); color: var(--danger); }
  .dash-delta.flat { background: var(--gray-soft); color: var(--text-sub); }
  .dash-card.primary .dash-delta.up { background: rgba(255,255,255,.22); color: #e0ffe0; }
  .dash-card.primary .dash-delta.down { background: rgba(255,255,255,.22); color: #ffd6d6; }
  .dash-card.primary .dash-delta.flat { background: rgba(255,255,255,.18); color: rgba(255,255,255,.85); }
  /* 棒グラフ（月別）— 棒とラベルを同じ flex セルにまとめて構造的にズレを防止
     高さは JS で px 直書き、絶対配置を撤廃して iOS Safari でも崩れない作り */
  .dash-bars-wrap { display: flex; gap: 4px; margin: 6px 0 4px; }
  .dash-bar-cell { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .dash-bar-track { width: 100%; height: 140px; display: flex; align-items: flex-end; justify-content: center; }
  .dash-bar-fill {
    width: 22px; max-width: 100%; min-height: 2px; border-radius: 4px 4px 0 0;
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    transition: height .3s;
  }
  .dash-bar-cell.current .dash-bar-fill {
    background: linear-gradient(180deg, var(--accent) 0%, #c54a00 100%);
  }
  .dash-bar-cell.future .dash-bar-fill { background: var(--border); }
  .dash-bar-lab { font-size: 10px; color: var(--text-mute); text-align: center; margin-top: 3px; line-height: 1; }
  .dash-bar-cell.current .dash-bar-lab { color: var(--accent); font-weight: 700; }
  /* 月別表 */
  .dash-month-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  .dash-month-table th, .dash-month-table td {
    padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  .dash-month-table th { color: var(--text-mute); font-weight: 500; font-size: 11px; }
  .dash-month-table td.label { text-align: left; color: var(--text-sub); }
  .dash-month-table tr.current td { background: #fff8f0; font-weight: 600; }
  /* 前月比/前年比のラベル付きスタック表示 */
  .dash-deltas { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; }
  .dash-delta-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .dash-delta-item .lab { opacity: .8; }
  .dash-card.primary .dash-delta-item .lab { color: rgba(255,255,255,.85); }
  /* 年切替ボタン */
  .dash-yearbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .dash-yearbar button {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-sub);
    border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .12s, color .12s, border-color .12s;
    font-family: inherit;
  }
  .dash-yearbar button:hover { background: var(--gray-soft); color: var(--text); }
  .dash-yearbar button.active {
    background: var(--primary); color: #fff; border-color: var(--primary);
  }
  /* 通年カードの 今年/前年 並列レイアウト */
  .dash-yoy { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
  .dash-yoy-cell {
    background: var(--bg); border-radius: 10px; padding: 10px 12px; min-width: 0;
  }
  .dash-yoy-cell .yoy-label { font-size: 11px; color: var(--text-mute); margin-bottom: 4px; letter-spacing: .04em; }
  .dash-yoy-cell .yoy-gross { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .dash-yoy-cell .yoy-sub { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
  @media (max-width: 480px) {
    .dash-num { font-size: 20px; }
    .dash-num.small { font-size: 14px; }
    .dash-bar-track { height: 110px; }
    .dash-month-table th:nth-child(4), .dash-month-table td:nth-child(4) { display: none; }
    .dash-deltas { flex-direction: column; gap: 6px; align-items: flex-start; }
    .dash-yoy { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="global-progress" aria-hidden="true"></div>

<div class="appbar">
  <div class="appbar-row1">
    <button class="icon-btn" id="appbar-menu-btn" onclick="appbarPrimaryAction_()" aria-label="メニュー">≡</button>
    <h1 id="appbar-title">商品管理</h1>
  </div>

    <span class="search-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
    <input id="search" type="search" placeholder="管理番号・ブランド・状態で検索" autocomplete="off" inputmode="search">
    <button type="button" class="clear-btn" id="search-clear" aria-label="クリア" onclick="clearSearch_()">✕</button>
  </div>
</div>

<div class="chips-bar" id="chips-bar" hidden></div>

<div class="img-modal" id="img-modal" onclick="closeImageModal_(event)" role="dialog" aria-modal="true">
  <button class="img-modal-close" type="button" onclick="closeImageModal_(event)" aria-label="閉じる">✕</button>
  <button class="img-modal-nav img-modal-prev" type="button" onclick="event.stopPropagation(); navImageModal_(-1)" aria-label="前の画像">‹</button>
  <button class="img-modal-nav img-modal-next" type="button" onclick="event.stopPropagation(); navImageModal_(1)" aria-label="次の画像">›</button>

</div>

<div class="drawer-mask" id="drawer-mask" onclick="closeDrawer()"></div>
<div class="leave-sheet-mask" id="leave-sheet-mask" onclick="leaveSheetCancel_(event)">
  <div class="leave-sheet" onclick="event.stopPropagation()">
    <h3>未保存の変更があります</h3>
    <div class="sub"><span id="leave-sheet-count">0</span>件の変更</div>
    <ul class="changes" id="leave-sheet-list"></ul>
    <div class="leave-sheet-actions">
      <button type="button" class="ls-save" id="leave-sheet-save" onclick="leaveSheetSave_()">保存して移動</button>
      <button type="button" class="ls-discard" onclick="leaveSheetDiscard_()">破棄して移動</button>
      <button type="button" class="ls-cancel" onclick="leaveSheetCancel_()">このページにとどまる</button>
    </div>
  </div>
</div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="app-name">外注アプリ</div>
    <div class="user" id="drawer-email">—</div>
  </div>
  <div class="drawer-list">
    <div class="drawer-section-label">業務</div>
    <div class="drawer-item" data-business="shiire_houkoku" onclick="selectBusinessMenu('shiire_houkoku','仕入れ数報告')">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg></span><span>仕入れ数報告</span>
    </div>
    <div class="drawer-item" data-business="keihi" onclick="selectBusinessMenu('keihi','経費申請')">
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 12l2 2 2-2 2 2 2-2"/></svg></span><span>経費申請</span>
    </div>
    <div class="drawer-item" data-business="houshu" onclick="selectBusinessMenu('houshu','報酬確認')">
      <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l3 4 3-4M12 13v5M9.5 15h5"/></svg></span><span>報酬確認</span>
    </div>
    <div class="drawer-divider"></div>
    <div class="drawer-section-label">設定</div>
    <div class="drawer-item" onclick="openSettingsView_('profile')">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span>個人情報・口座情報</span>
    </div>
    <div class="drawer-item" data-admin-only onclick="openSettingsView_('admin_invoice')">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13h6M9 17h6"/></svg></span><span>請求書管理者設定</span>
    </div>
    <div class="drawer-item" onclick="openNotificationSettings()">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M6 19V11a6 6 0 0 1 12 0v8"/><path d="M3 19h18"/><path d="M10 22h4"/></svg></span><span>通知設定</span>
    </div>
  </div>
</div>

<div class="content" id="content">
  <div class="loading skeleton-init"><div class="sk-bar"></div><div class="sk-bar sk-bar-narrow"></div><div class="sk-cards"><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div></div></div>
</div>

    <button data-tab="shouhin" class="active" onclick="selectTab('shouhin')"><span class="ico">👕</span><span class="lbl">商品管理</span></button>

    <button data-tab="basho" onclick="selectTab('basho')"><span class="ico">📍</span><span class="lbl">場所移動</span></button>
    <button data-tab="hensou" onclick="selectTab('hensou')"><span class="ico">📤</span><span class="lbl">返送</span></button>
    <button data-tab="uriage" data-admin-only onclick="selectTab('uriage')"><span class="ico">📈</span><span class="lbl">売上</span></button>
    <button data-tab="sagyou" data-admin-only onclick="selectTab('sagyou')"><span class="ico">👥</span><span class="lbl">作業者管理</span></button>

</div>

</div>
